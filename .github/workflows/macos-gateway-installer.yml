name: macOS Gateway user installers
on:
  push:
    branches: ['build/macos-client-*']
    paths:
      - 'projects/awsome-ai-gateway/macos-client/**'
      - '.github/workflows/macos-gateway-installer.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/awsome-ai-gateway/macos-client
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      GATEWAY_URL: https://d3o0i8nq4xi4k4.cloudfront.net
      GATEWAY_ADMIN_API_URL: https://d3o0i8nq4xi4k4.cloudfront.net
      GATEWAY_ISSUER: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_XPlarTmJ3
      GATEWAY_CLIENT_ID: 52m5ri9v4u79qmdj7e2avu9u4o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install ../gateway-cli -r requirements-build.txt
      - name: Run safety and profile tests
        run: python -m unittest discover -s tests -v
      - name: Build native package
        run: python build.py
      - name: Verify package installation and installed binaries
        run: |
          sudo installer -pkg "dist/AWSomeGatewaySetup-macOS-${EXPECTED_ARCH}-v0.1.1.pkg" -target /
          '/Library/Application Support/AWSomeGateway/helper/api-key-helper' --self-test
          '/Applications/AWSome Gateway Login.app/Contents/MacOS/AWSome Gateway Login' --self-test
          python - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('/Library/Application Support/AWSomeGateway/ClaudeGateway.mobileconfig')
          d=plistlib.loads(p.read_bytes())['PayloadContent'][0]
          assert d['inferenceModels'][0]=='claude-haiku-5-5'
          assert 'inferenceGatewayApiKey' not in d
          assert Path(d['inferenceCredentialHelper']).is_file()
          print('Installed profile and helper path: OK')
          PY
          # Verify only our fresh CI package. No profiles are installed during CI.
          printf 'REMOVE\n' | sudo '/Library/Application Support/AWSomeGateway/uninstall.sh'
          test ! -e '/Applications/AWSome Gateway Login.app'
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-user-installer-${{ matrix.arch }}
          path: projects/awsome-ai-gateway/macos-client/dist/*
          if-no-files-found: error
          retention-days: 14
